suite: extraEnv is exempt from the reserved-name collision check
templates:
  - daemonset.yaml
  - chao-deployment.yaml
release:
  name: my-release
  namespace: my-namespace
  revision: 1
  upgrade: true

tests:
  - it: should still render successfully when gremlin.extraEnv shadows a chart-managed env var name
    set:
      gremlin.extraEnv:
        - name: GREMLIN_TEAM_ID
          value: overridden-team-id
    asserts:
      - notFailedTemplate: {}
        template: daemonset.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GREMLIN_TEAM_ID
            value: overridden-team-id
        template: daemonset.yaml

  - it: should still render successfully when chao.extraEnv shadows a chart-managed env var name
    set:
      chao.extraEnv:
        - name: GREMLIN_CLUSTER_ID
          value: overridden-cluster-id
    asserts:
      - notFailedTemplate: {}
        template: chao-deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GREMLIN_CLUSTER_ID
            value: overridden-cluster-id
        template: chao-deployment.yaml
