suite: EN-11853 B6 - terminationGracePeriodSeconds
templates:
  - daemonset.yaml
  - chao-deployment.yaml
release:
  name: my-release
  namespace: my-namespace
  revision: 1
  upgrade: true

tests:
  - it: should render a user-supplied terminationGracePeriodSeconds on the gremlin DaemonSet
    set:
      terminationGracePeriodSeconds: 45
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 45
        template: daemonset.yaml

  - it: should render terminationGracePeriodSeconds of 0 on the gremlin DaemonSet without being dropped as falsy
    set:
      terminationGracePeriodSeconds: 0
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 0
        template: daemonset.yaml

  - it: should not render terminationGracePeriodSeconds on the gremlin DaemonSet by default
    asserts:
      - notExists:
          path: spec.template.spec.terminationGracePeriodSeconds
        template: daemonset.yaml

  - it: should render a user-supplied terminationGracePeriodSeconds on the chao Deployment
    set:
      chao.terminationGracePeriodSeconds: 45
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 45
        template: chao-deployment.yaml

  - it: should render terminationGracePeriodSeconds of 0 on the chao Deployment without being dropped as falsy
    set:
      chao.terminationGracePeriodSeconds: 0
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 0
        template: chao-deployment.yaml

  - it: should not render terminationGracePeriodSeconds on the chao Deployment by default
    asserts:
      - notExists:
          path: spec.template.spec.terminationGracePeriodSeconds
        template: chao-deployment.yaml
