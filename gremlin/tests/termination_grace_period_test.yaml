suite: terminationGracePeriodSeconds
templates:
  - daemonset.yaml
  - chao-deployment.yaml
release:
  name: my-release
  namespace: my-namespace
  revision: 1
  upgrade: true

tests:
  - it: should render a user-supplied terminationGracePeriodSeconds on the gremlin DaemonSet
    set:
      terminationGracePeriodSeconds: 45
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 45
        template: daemonset.yaml

  - it: should render terminationGracePeriodSeconds of 0 on the gremlin DaemonSet without being dropped as falsy
    set:
      terminationGracePeriodSeconds: 0
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 0
        template: daemonset.yaml

  - it: should not render terminationGracePeriodSeconds on the gremlin DaemonSet by default
    asserts:
      - notExists:
          path: spec.template.spec.terminationGracePeriodSeconds
        template: daemonset.yaml

  - it: should reject a non-numeric terminationGracePeriodSeconds on the gremlin DaemonSet via the values schema
    set:
      terminationGracePeriodSeconds: not-a-number
    asserts:
      # Helm 3.17 and Helm 4.x word this rejection differently (design.md 7.5) - match only on
      # the value path, which both phrasings name, never on the surrounding wording.
      - failedTemplate:
          errorPattern: terminationGracePeriodSeconds

  - it: should reject a multiline terminationGracePeriodSeconds string on the gremlin DaemonSet via the values schema, rather than letting it inject a sibling pod-spec field
    set:
      terminationGracePeriodSeconds: |-
        45
        hostIPC: true
    asserts:
      - failedTemplate:
          errorPattern: terminationGracePeriodSeconds

  - it: should render a user-supplied terminationGracePeriodSeconds on the chao Deployment
    set:
      chao.terminationGracePeriodSeconds: 45
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 45
        template: chao-deployment.yaml

  - it: should render terminationGracePeriodSeconds of 0 on the chao Deployment without being dropped as falsy
    set:
      chao.terminationGracePeriodSeconds: 0
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 0
        template: chao-deployment.yaml

  - it: should not render terminationGracePeriodSeconds on the chao Deployment by default
    asserts:
      - notExists:
          path: spec.template.spec.terminationGracePeriodSeconds
        template: chao-deployment.yaml
