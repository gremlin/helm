suite: Test GPU / OpenCL access options
templates:
  - daemonset.yaml
release:
  name: my-release
  namespace: my-namespace
  revision: 1
  upgrade: true
tests:
  - it: should not add any GPU configuration by default
    asserts:
      - notExists:
          path: spec.template.spec.runtimeClassName
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: opencl-vendors
            hostPath:
              path: /etc/OpenCL/vendors
              type: DirectoryOrCreate

  - it: should not add GPU configuration when a vendor is set but gpu is disabled
    set:
      gremlin.gpu.enabled: false
      gremlin.gpu.vendor: nvidia
    asserts:
      - notExists:
          path: spec.template.spec.runtimeClassName
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: NVIDIA_VISIBLE_DEVICES
            value: "all"

  # --- Easy default: nvidia block ----------------------------------------------------------
  - it: should apply the nvidia block when enabled with the default vendor
    set:
      gremlin.gpu.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.runtimeClassName
          value: nvidia
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NVIDIA_VISIBLE_DEVICES
            value: "all"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NVIDIA_DRIVER_CAPABILITIES
            value: "all"
      # nvidia relies on the container toolkit, so no GPU hostPath volumes are added
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: opencl-vendors
            hostPath:
              path: /etc/OpenCL/vendors
              type: DirectoryOrCreate
      # the OpenCL ICD registry file is projected so the injected driver is discoverable
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: gremlin-opencl-icd
            mountPath: /etc/OpenCL/vendors/nvidia.icd
            subPath: nvidia.icd
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: gremlin-opencl-icd
            configMap:
              name: my-release-gremlin-opencl-icd

  - it: should not project the OpenCL ICD when the vendor block defines none
    set:
      gremlin.gpu.enabled: true
      gremlin.gpu.vendor: ""
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: gremlin-opencl-icd
            mountPath: /etc/OpenCL/vendors/nvidia.icd
            subPath: nvidia.icd
            readOnly: true

  # --- Easy default: amd block -------------------------------------------------------------
  - it: should apply the amd block when vendor is amd
    set:
      gremlin.gpu.enabled: true
      gremlin.gpu.vendor: amd
    asserts:
      # amd does not use a RuntimeClass
      - notExists:
          path: spec.template.spec.runtimeClassName
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: kfd
            mountPath: /dev/kfd
            readOnly: false
      - contains:
          path: spec.template.spec.volumes
          content:
            name: kfd
            hostPath:
              path: /dev/kfd
              type: CharDevice
      - contains:
          path: spec.template.spec.volumes
          content:
            name: dri
            hostPath:
              path: /dev/dri
              type: Directory
      - contains:
          path: spec.template.spec.volumes
          content:
            name: opencl-vendors
            hostPath:
              path: /etc/OpenCL/vendors
              type: DirectoryOrCreate
      # amd already mounts /etc/OpenCL/vendors from the host and defines no openclIcd, so the
      # chart does not project its own ICD file there
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: gremlin-opencl-icd
            configMap:
              name: my-release-gremlin-opencl-icd

  - it: should apply no GPU config when vendor is blank
    set:
      gremlin.gpu.enabled: true
      gremlin.gpu.vendor: ""
    asserts:
      - notExists:
          path: spec.template.spec.runtimeClassName
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: kfd
            hostPath:
              path: /dev/kfd
              type: CharDevice

  # --- Editing / overriding a vendor block -------------------------------------------------
  - it: should honor a runtimeClassName set on the vendor block
    set:
      gremlin.gpu.enabled: true
      gremlin.gpu.vendor: nvidia
      gremlin.gpu.nvidia.runtimeClassName: nvidia-custom
    asserts:
      - equal:
          path: spec.template.spec.runtimeClassName
          value: nvidia-custom

  - it: should honor env set on the vendor block
    set:
      gremlin.gpu.enabled: true
      gremlin.gpu.vendor: nvidia
      gremlin.gpu.nvidia.env:
        - name: NVIDIA_VISIBLE_DEVICES
          value: "0,1"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NVIDIA_VISIBLE_DEVICES
            value: "0,1"
      # the block's env is the whole list, so the default NVIDIA_DRIVER_CAPABILITIES is gone
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: NVIDIA_DRIVER_CAPABILITIES
            value: "all"

  - it: should render native volumes and volumeMounts from a custom vendor block
    set:
      gremlin.gpu.enabled: true
      gremlin.gpu.vendor: custom
      gremlin.gpu.custom.volumes:
        - name: nvidia0
          hostPath:
            path: /dev/nvidia0
            type: CharDevice
      gremlin.gpu.custom.volumeMounts:
        - name: nvidia0
          mountPath: /dev/nvidia0
          readOnly: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: nvidia0
            mountPath: /dev/nvidia0
            readOnly: false
      - contains:
          path: spec.template.spec.volumes
          content:
            name: nvidia0
            hostPath:
              path: /dev/nvidia0
              type: CharDevice

  # --- CDI (Container Device Interface) ----------------------------------------------------
  - it: should not add a CDI annotation by default
    set:
      gremlin.gpu.enabled: true
    asserts:
      - notExists:
          path: spec.template.metadata.annotations["cdi.k8s.io/gremlin-gpu"]

  - it: should add the CDI device annotation when cdiDevice is set
    set:
      gremlin.gpu.enabled: true
      gremlin.gpu.cdiDevice: nvidia.com/gpu=all
    asserts:
      - equal:
          path: spec.template.metadata.annotations["cdi.k8s.io/gremlin-gpu"]
          value: nvidia.com/gpu=all

  - it: should let a vendor block override the CDI device
    set:
      gremlin.gpu.enabled: true
      gremlin.gpu.cdiDevice: nvidia.com/gpu=all
      gremlin.gpu.nvidia.cdiDevice: nvidia.com/gpu=0
    asserts:
      - equal:
          path: spec.template.metadata.annotations["cdi.k8s.io/gremlin-gpu"]
          value: nvidia.com/gpu=0

  - it: should not add a CDI annotation when gpu is disabled
    set:
      gremlin.gpu.enabled: false
      gremlin.gpu.cdiDevice: nvidia.com/gpu=all
    asserts:
      - notExists:
          path: spec.template.metadata.annotations["cdi.k8s.io/gremlin-gpu"]

  # --- ICD projection toggle ---------------------------------------------------------------
  - it: should not project the OpenCL ICD when projectOpenclIcd is false
    set:
      gremlin.gpu.enabled: true
      gremlin.gpu.projectOpenclIcd: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: gremlin-opencl-icd
            mountPath: /etc/OpenCL/vendors/nvidia.icd
            subPath: nvidia.icd
            readOnly: true
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: gremlin-opencl-icd
            configMap:
              name: my-release-gremlin-opencl-icd

  # --- Single DaemonSet under helm template (lookup finds no nodes) ------------------------
  - it: should render exactly one DaemonSet when GPU is enabled (falls back without a cluster)
    set:
      gremlin.gpu.enabled: true
    asserts:
      - hasDocuments:
          count: 1
