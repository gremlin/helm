suite: Test GPU / OpenCL access options
templates:
  - daemonset.yaml
release:
  name: my-release
  namespace: my-namespace
  revision: 1
  upgrade: true
tests:
  # --- GPU disabled: one DaemonSet, keeping the original name ------------------------------
  - it: should render a single DaemonSet with no GPU configuration by default
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: my-release-gremlin
      - notExists:
          path: metadata.labels["gremlin.com/gpu"]
      - notExists:
          path: spec.template.spec.runtimeClassName
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: opencl-vendors
            hostPath:
              path: /etc/OpenCL/vendors
              type: DirectoryOrCreate

  - it: should not add GPU configuration when vendors are set but gpu is disabled
    set:
      gremlin.gpu.enabled: false
      gremlin.gpu.vendors:
        - nvidia
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: my-release-gremlin
      - notExists:
          path: spec.template.spec.runtimeClassName
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: NVIDIA_VISIBLE_DEVICES
            value: "all"

  # --- GPU enabled: one DaemonSet per vendor, plus gpu-none --------------------------------
  - it: should render one DaemonSet per vendor plus a gpu-none DaemonSet when enabled
    set:
      gremlin.gpu.enabled: true
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: metadata.name
          value: my-release-gremlin-gpu-nvidia
        documentIndex: 0
      - equal:
          path: metadata.name
          value: my-release-gremlin-gpu-amd
        documentIndex: 1
      - equal:
          path: metadata.name
          value: my-release-gremlin-gpu-none
        documentIndex: 2

  - it: should render a DaemonSet per vendor even when only one vendor is listed
    set:
      gremlin.gpu.enabled: true
      gremlin.gpu.vendors:
        - nvidia
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: my-release-gremlin-gpu-nvidia
        documentIndex: 0
      - equal:
          path: metadata.name
          value: my-release-gremlin-gpu-none
        documentIndex: 1

  - it: should render only the gpu-none DaemonSet when no vendors are listed
    set:
      gremlin.gpu.enabled: true
      gremlin.gpu.vendors: []
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: my-release-gremlin-gpu-none
      # with no vendor labels to exclude there is nothing to add to the user's affinity
      - notExists:
          path: spec.template.spec.affinity

  # --- Each DaemonSet carries its own vendor's configuration -------------------------------
  - it: should apply the nvidia block to the nvidia DaemonSet
    set:
      gremlin.gpu.enabled: true
    documentSelector:
      path: metadata.name
      value: my-release-gremlin-gpu-nvidia
    asserts:
      - equal:
          path: metadata.labels["gremlin.com/gpu"]
          value: nvidia
      - equal:
          path: spec.selector.matchLabels["gremlin.com/gpu"]
          value: nvidia
      - equal:
          path: spec.template.spec.runtimeClassName
          value: nvidia
      # scheduled onto the nvidia nodes
      - contains:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions
          content:
            key: nvidia.com/gpu.present
            operator: In
            values:
              - "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NVIDIA_VISIBLE_DEVICES
            value: "all"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NVIDIA_DRIVER_CAPABILITIES
            value: "all"
      # nvidia relies on the container toolkit, so no GPU hostPath volumes are added
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: opencl-vendors
            hostPath:
              path: /etc/OpenCL/vendors
              type: DirectoryOrCreate
      # the OpenCL ICD registry file is projected so the injected driver is discoverable
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: gremlin-opencl-icd
            mountPath: /etc/OpenCL/vendors/nvidia.icd
            subPath: nvidia.icd
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: gremlin-opencl-icd
            configMap:
              name: my-release-gremlin-opencl-icd

  - it: should apply the amd block to the amd DaemonSet
    set:
      gremlin.gpu.enabled: true
    documentSelector:
      path: metadata.name
      value: my-release-gremlin-gpu-amd
    asserts:
      - equal:
          path: metadata.labels["gremlin.com/gpu"]
          value: amd
      # amd does not use a RuntimeClass
      - notExists:
          path: spec.template.spec.runtimeClassName
      # scheduled onto the amd nodes
      - contains:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions
          content:
            key: amd.com/gpu.present
            operator: In
            values:
              - "true"
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: kfd
            mountPath: /dev/kfd
            readOnly: false
      - contains:
          path: spec.template.spec.volumes
          content:
            name: kfd
            hostPath:
              path: /dev/kfd
              type: CharDevice
      - contains:
          path: spec.template.spec.volumes
          content:
            name: dri
            hostPath:
              path: /dev/dri
              type: Directory
      - contains:
          path: spec.template.spec.volumes
          content:
            name: opencl-vendors
            hostPath:
              path: /etc/OpenCL/vendors
              type: DirectoryOrCreate
      # amd already mounts /etc/OpenCL/vendors from the host and defines no openclIcd, so the
      # chart does not project its own ICD file there
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: gremlin-opencl-icd
            configMap:
              name: my-release-gremlin-opencl-icd

  - it: should keep the gpu-none DaemonSet off every vendor's nodes and free of GPU config
    set:
      gremlin.gpu.enabled: true
    documentSelector:
      path: metadata.name
      value: my-release-gremlin-gpu-none
    asserts:
      - equal:
          path: metadata.labels["gremlin.com/gpu"]
          value: none
      - equal:
          path: spec.selector.matchLabels["gremlin.com/gpu"]
          value: none
      - notExists:
          path: spec.template.spec.runtimeClassName
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: NVIDIA_VISIBLE_DEVICES
            value: "all"
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: kfd
            hostPath:
              path: /dev/kfd
              type: CharDevice
      - contains:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions
          content:
            key: nvidia.com/gpu.present
            operator: NotIn
            values:
              - "true"
      - contains:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions
          content:
            key: amd.com/gpu.present
            operator: NotIn
            values:
              - "true"

  - it: should AND the vendor node requirement into a user-supplied affinity
    set:
      gremlin.gpu.enabled: true
      gremlin.gpu.vendors:
        - nvidia
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/os
                    operator: In
                    values:
                      - linux
    documentSelector:
      path: metadata.name
      value: my-release-gremlin-gpu-nvidia
    asserts:
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms
          value:
            - matchExpressions:
                - key: kubernetes.io/os
                  operator: In
                  values:
                    - linux
                - key: nvidia.com/gpu.present
                  operator: In
                  values:
                    - "true"

  # --- Editing / overriding a vendor block -------------------------------------------------
  - it: should honor a runtimeClassName set on the vendor block
    set:
      gremlin.gpu.enabled: true
      gremlin.gpu.nvidia.runtimeClassName: nvidia-custom
    documentSelector:
      path: metadata.name
      value: my-release-gremlin-gpu-nvidia
    asserts:
      - equal:
          path: spec.template.spec.runtimeClassName
          value: nvidia-custom

  - it: should honor env set on the vendor block
    set:
      gremlin.gpu.enabled: true
      gremlin.gpu.nvidia.env:
        - name: NVIDIA_VISIBLE_DEVICES
          value: "0,1"
    documentSelector:
      path: metadata.name
      value: my-release-gremlin-gpu-nvidia
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NVIDIA_VISIBLE_DEVICES
            value: "0,1"
      # the block's env is the whole list, so the default NVIDIA_DRIVER_CAPABILITIES is gone
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: NVIDIA_DRIVER_CAPABILITIES
            value: "all"

  - it: should render native volumes and volumeMounts from a custom vendor block
    set:
      gremlin.gpu.enabled: true
      gremlin.gpu.vendors:
        - custom
      gremlin.gpu.custom.nodeSelector:
        my.com/gpu.present: "true"
      gremlin.gpu.custom.volumes:
        - name: nvidia0
          hostPath:
            path: /dev/nvidia0
            type: CharDevice
      gremlin.gpu.custom.volumeMounts:
        - name: nvidia0
          mountPath: /dev/nvidia0
          readOnly: false
    documentSelector:
      path: metadata.name
      value: my-release-gremlin-gpu-custom
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: nvidia0
            mountPath: /dev/nvidia0
            readOnly: false
      - contains:
          path: spec.template.spec.volumes
          content:
            name: nvidia0
            hostPath:
              path: /dev/nvidia0
              type: CharDevice
      - contains:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions
          content:
            key: my.com/gpu.present
            operator: In
            values:
              - "true"

  # --- CDI (Container Device Interface) ----------------------------------------------------
  - it: should not add a CDI annotation by default
    set:
      gremlin.gpu.enabled: true
    documentSelector:
      path: metadata.name
      value: my-release-gremlin-gpu-nvidia
    asserts:
      - notExists:
          path: spec.template.metadata.annotations["cdi.k8s.io/gremlin-gpu"]

  - it: should add the CDI device annotation to the vendor DaemonSets when cdiDevice is set
    set:
      gremlin.gpu.enabled: true
      gremlin.gpu.cdiDevice: nvidia.com/gpu=all
    asserts:
      - equal:
          path: spec.template.metadata.annotations["cdi.k8s.io/gremlin-gpu"]
          value: nvidia.com/gpu=all
        documentSelector:
          path: metadata.name
          value: my-release-gremlin-gpu-nvidia
      # the non-GPU nodes get no CDI device
      - notExists:
          path: spec.template.metadata.annotations["cdi.k8s.io/gremlin-gpu"]
        documentSelector:
          path: metadata.name
          value: my-release-gremlin-gpu-none

  - it: should let a vendor block override the CDI device
    set:
      gremlin.gpu.enabled: true
      gremlin.gpu.cdiDevice: nvidia.com/gpu=all
      gremlin.gpu.nvidia.cdiDevice: nvidia.com/gpu=0
    asserts:
      - equal:
          path: spec.template.metadata.annotations["cdi.k8s.io/gremlin-gpu"]
          value: nvidia.com/gpu=0
        documentSelector:
          path: metadata.name
          value: my-release-gremlin-gpu-nvidia
      - equal:
          path: spec.template.metadata.annotations["cdi.k8s.io/gremlin-gpu"]
          value: nvidia.com/gpu=all
        documentSelector:
          path: metadata.name
          value: my-release-gremlin-gpu-amd

  - it: should not add a CDI annotation when gpu is disabled
    set:
      gremlin.gpu.enabled: false
      gremlin.gpu.cdiDevice: nvidia.com/gpu=all
    asserts:
      - notExists:
          path: spec.template.metadata.annotations["cdi.k8s.io/gremlin-gpu"]

  # --- ICD projection toggle ---------------------------------------------------------------
  - it: should not project the OpenCL ICD when projectOpenclIcd is false
    set:
      gremlin.gpu.enabled: true
      gremlin.gpu.projectOpenclIcd: false
    documentSelector:
      path: metadata.name
      value: my-release-gremlin-gpu-nvidia
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: gremlin-opencl-icd
            mountPath: /etc/OpenCL/vendors/nvidia.icd
            subPath: nvidia.icd
            readOnly: true
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: gremlin-opencl-icd
            configMap:
              name: my-release-gremlin-opencl-icd

  - it: should not project the OpenCL ICD when the vendor block defines none
    set:
      gremlin.gpu.enabled: true
      gremlin.gpu.nvidia.openclIcd: null
    documentSelector:
      path: metadata.name
      value: my-release-gremlin-gpu-nvidia
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: gremlin-opencl-icd
            mountPath: /etc/OpenCL/vendors/nvidia.icd
            subPath: nvidia.icd
            readOnly: true
