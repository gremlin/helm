# Default values for gremlin.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  # image.repository -- Container image to use
  repository: gremlin/gremlin
  # image.tag -- Container image tag to deploy. [See below](#pinning-the-agent-version)
  tag: latest # @schema type:[string, integer, number]
  # image.pullPolicy -- Container pull policy
  pullPolicy: Always
  # image.pullSecret -- Pull secret for a private registry
  # @default -- `""` (When empty, no authentication is used)
  pullSecret: # @schema type:[string, null]

chaoimage:
  # chaoimage.repository -- Container image to use for the `chao` container
  repository: gremlin/chao
  # chaoimage.tag -- Container image tag to deploy for the `chao` container. [See below](#pinning-the-agent-version)
  tag: latest # @schema type:[string, integer, number]
  # chaoimage.pullPolicy -- Container pull policy for the `chao` container
  pullPolicy: Always
  # chaoimage.pullSecret -- Pull secret for a private registry for the `chao` container
  # @default -- `""` (When empty, no authentication is used)
  pullSecret: # @schema type:[string, null]

# nameOverride -- Overrides the chart name used when computing the release's derived resource names.
nameOverride: ""
# fullnameOverride -- Overrides the full, generated name of the release's resources.
fullnameOverride: ""

# nodeSelector -- Map of node labels for pod assignment for the `gremlin` container
nodeSelector: {}

# tolerations -- List of node taints to tolerate for the `gremlin` container
tolerations: []

# affinity -- Map of node/pod affinities for the `gremlin` container
affinity: {}

# livenessProbe -- A Kubernetes `Probe` for the `gremlin` container
livenessProbe: {}

# readinessProbe -- A Kubernetes `Probe` for the `gremlin` container
readinessProbe: {}

# startupProbe -- A Kubernetes `Probe` for the `gremlin` container
startupProbe: {}

# initContainers -- Additional init containers for the `gremlin` DaemonSet, appended after
# `seccomp-init` when enabled. A name colliding with one the chart manages fails the install
# NOTE: when gremlin.podSecurity.podSecurityPolicy.create (or ...securityContextConstraints.create)
# is enabled, the chart's own PSP/SCC may reject volumes an init container mounts; see
# extraVolumes below.
initContainers: []

# extraVolumes -- Additional volumes for the `gremlin` DaemonSet. A name colliding with one the
# chart manages fails the install
# NOTE: when gremlin.podSecurity.podSecurityPolicy.create (or ...securityContextConstraints.create)
# is enabled, a volume type or hostPath outside what gremlin.podSecurity.volumes /
# allowedHostPaths permits is rejected at admission, not by this chart.
extraVolumes: []

# extraVolumeMounts -- Additional volume mounts for the `gremlin` container. A name colliding with
# one the chart manages fails the install
extraVolumeMounts: []

# lifecycle -- A Kubernetes `Lifecycle` object (`preStop`/`postStart`) for the `gremlin` container
lifecycle: {}

# envFrom -- Additional `ConfigMap`/`Secret` sources for the `gremlin` container's environment.
# Unlike `gremlin.extraEnv`, does not override chart-managed env vars (Kubernetes gives `env:`
# precedence over `envFrom:`)
envFrom: []

# terminationGracePeriodSeconds -- Termination grace period, in seconds, for the `gremlin`
# DaemonSet's pods
# @default -- (Kubernetes default: `30`)
terminationGracePeriodSeconds: # @schema type:[integer, string, null];pattern:^[0-9]+$

# dnsConfig -- A Kubernetes `PodDNSConfig` for the `gremlin` DaemonSet's pod spec
dnsConfig: {}

# hostAliases -- A list of Kubernetes `HostAlias` entries for the `gremlin` DaemonSet's pod spec.
# No effect while `gremlin.hostNetwork` is `true` (the default)
hostAliases: []

# podSecurityContext -- A Kubernetes pod-level `SecurityContext` for the `gremlin` DaemonSet,
# alongside the existing container-level `gremlin.podSecurity.*` settings
podSecurityContext: {}

gremlin:

  # gremlin.updateStrategy -- The rollout strategy Kubernetes will use when updating the Gremlin daemonset
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1 # @schema type:[integer, string]

  # gremlin.priorityClassName -- The priority class to use for the agent DaemonSet
  priorityClassName: ""

  # gremlin.podLabels -- Kubernetes labels applied to the Gremlin Agent's DaemonSet and it's pods
  podLabels: {}

  # gremlin.podAnnotations -- Additional annotations applied to the Gremlin Agent's DaemonSet pods
  podAnnotations: {}

  # gremlin.apparmor -- Apparmor profile to set for the Gremlin Daemon
  # @default -- `""` (When empty, no profile is set)
  apparmor: # @schema type:[string, null]

  collect:
    # gremlin.collect.dns -- Specifies whether Gremlin should collect DNS call information
    dns: true

  # gremlin.hostPID -- Enable host-level process killing
  hostPID: true

  # gremlin.dnsPolicy -- The DNS policy to use for the Gremlin DaemonSet
  dnsPolicy: ClusterFirstWithHostNet

  # gremlin.hostNetwork -- Enable host-level network attacks
  hostNetwork: true

  # gremlin.installApparmorProfile -- Have Gremlin install their own [Apparmor Profile](agent_apparmor.profile) (NOTE: `gremlin.apparmor` overrides this)
  installApparmorProfile: false
  client:
    # gremlin.client.tags -- Comma-separated list of `key=value` tag pairs to assign to this client.
    # Commas must be backslash-escaped when using `--set`; see [Example Usage](#example-usage)
    tags: ""

  container:
    # gremlin.container.driver -- Specifies which container driver with which to run Gremlin. [See example][driverexample]
    driver: any

  cgroup:
    # gremlin.cgroup.root -- Specifies the absolute path for the cgroup controller root on target host systems
    root: /sys/fs/cgroup

  serviceAccount:
    # gremlin.serviceAccount.create -- Specifies whether Gremlin's kubernetes service account should be created by this helm chart
    create: true
    # Annotations to add to the service account
    annotations: { }

  podSecurity:

    # gremlin.podSecurity.allowPrivilegeEscalation -- Allows Gremlin containers privilege escalation powers
    allowPrivilegeEscalation: false

    # gremlin.podSecurity.capabilities -- Specifies which Linux capabilities should be granted to Gremlin
    capabilities:
      - KILL            # Required to run Process Killer attacks
      - NET_ADMIN       # Required to run network attacks
      - SYS_BOOT        # Required to run Shutdown attacks
      - SYS_TIME        # Required to run Time Travel attacks
      - DAC_READ_SEARCH # Required to run Certificate Expiry attacks with CIDR address arguments, and to discover dependencies
      - SYS_RESOURCE    # Required to run Process Exhaustion attacks against containers
      - SYS_ADMIN       # Required to apply impact within container namespaces
      - SYS_PTRACE      # Required to to identify charactistics of container processes (such as associated network)
      - NET_RAW         # Required to discover dependencies

    # gremlin.podSecurity.seLinuxOptions -- Specifies SELinux options to apply to the Gremlin Daemonset container securityContext. WARNING: This option should be enabled with caution as it is likely to break the GremlinAgent or your Kubernetes installation. Gremlin recommends users instead install a custom SELinux policy that provides integration with the labels already defined on the target system so that paths do not need to be relabeled. See https://github.com/gremlin/selinux-policies
    # @default -- `{}`
    # The fragment and the sibling type: below must each independently read as "object or
    # null" - Helm 3's validator ignores a $ref's sibling keywords and Helm 4's applies them
    # as an AND, so both halves are load-bearing, each for a different Helm major.
    seLinuxOptions: # @schema $ref: schemas/selinuxoptions.json;type:[object, null]
      # gremlin.podSecurity.seLinuxOptions.type -
      # Specifies the process label gremlind processes should run under. When running BottleRocket for example, this should be set to `super_t`
      # type: super_t

    # gremlin.podSecurity.readOnlyRootFilesystem -- Forces the Gremlin Daemonset containers to run with a read-only root filesystem
    # NOTE: When true, Disk and IO experiments against the host will fail unless they target an external volume
    readOnlyRootFilesystem: false

    # gremlin.podSecurity.supplementalGroups -
    # Specifies the Linux groups the Gremlin Daemonset containers should run as
    supplementalGroups:
      # gremlin.podSecurity.supplementalGroups.rule -- Specifies the Linux groups the Gremlin Daemonset containers should run as
      rule: RunAsAny

    # gremlin.podSecurity.fsGroup -
    # Specifies the Linux groups applied to mounted volumes
    fsGroup:
      # gremlin.podSecurity.fsGroup.rule -- Specifies the Linux groups applied to mounted volumes
      rule: RunAsAny

    # gremlin.podSecurity.volumes -- Specifies the volume types the Gremlin Daemonset is allowed to use
    volumes:
      - configMap   # Required when the Gremlin Daemonset installs a seccomp profile (see gremlin.podSecurity.seccomp)
      - secret      # Required to store and load secret information like certificates that authenticate Gremlin
      - hostPath    # Required by Gremlin to store attack logs (/var/log/gremlin) and attack state (/var/lib/gremlin/executions)
      - emptyDir    # Required by Gremlin to store transient files, such as `/var/lib/gremlin/.credentials`

    podSecurityPolicy:
      # gremlin.podSecurity.podSecurityPolicy.create -- When true, Gremlin creates and uses a custom PodSecurityPolicy, granting all behaviors Gremlin needs
      create: false
      # gremlin.podSecurity.podSecurityPolicy.seLinux -- Sets the SecurityContext for the PSP used by the Gremlin Daemonset
      seLinux:
        rule: MustRunAs
        seLinuxOptions:
          type: gremlin.process
          level: s0-s0:c0.c1023
      # gremlin.podSecurity.podSecurityPolicy.runAsUser -
      # Specifies the Linux user the Gremlin Daemonset containers should run as
      runAsUser:
        # gremlin.podSecurity.podSecurityPolicy.runAsUser.rule -- Specifies the Linux user the Gremlin Daemonset containers should run as
        rule: RunAsAny

    securityContextConstraints:
      # gremlin.podSecurity.securityContextConstraints.create -- When true, Gremlin creates and uses a custom SecurityContextConstraints, granting all behaviors Gremlin needs
      create: false
      # gremlin.podSecurity.securityContextConstraints.allowHostDirVolumePlugin -- Specifies whether the Gremlin Daemonset has access to host path directories as mounted volumes
      allowHostDirVolumePlugin: true
      # gremlin.podSecurity.securityContextConstraints.seLinuxContext -- Sets the SecurityContext for the SCC used by the Gremlin Daemonset
      seLinuxContext:
        type: MustRunAs
        seLinuxOptions:
          #  gremlin.podSecurity.securityContextConstraints.seLinuxContext.type -
          #  Specifies the SELinux process label gremlin should run under. OpenShift uses the CRI-O container runtime, which deploys any container with hostPID=true as `spc_t`. Any other value is ignored.
          type: spc_t
          level: s0-s0:c0.c1023
      # gremlin.podSecurity.securityContextConstraints.runAsUser -
      # Specifies the Linux user the Gremlin Daemonset containers should run as
      runAsUser:
        # gremlin.podSecurity.securityContextConstraints.runAsUser.type -- Specifies the Linux user the Gremlin Daemonset containers should run as
        type: RunAsAny

    # gremlin.podSecurity.privileged -- Determines whether the Gremlin Daemonset should run privileged containers
    privileged: false

    # gremlin.podSecurity.seccomp -
    # All of Gremlin's behavior runs under Docker's default seccomp profile. For systems with a more restrictive
    #   runtime/default profile, Gremlin can create and the specific seccomp profile it needs.
    seccomp:
      # gremlin.podSecurity.seccomp.enabled -- Determines whether the Gremlin Daemonset should be annotated with the seccomp profile specified by
      #   gremlin.podSecurity.seccomp.profile
      enabled: false
      # gremlin.podSecurity.seccomp.profile -- Describes the name of the seccomp profile to use
      #
      # NOTE: When this value is `localhost/gremlin`, Gremlin will create its own custom seccomp profile
      profile: localhost/gremlin
      # gremlin.podSecurity.seccomp.root
      # The absolute path pointing to the seccomp profile root on cluster nodes
      root: /var/lib/kubelet/seccomp

  # gremlin.resources -- Set resource requests and limits
  # See: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers
  resources: {}

  # gremlin.gpu -
  # Exposes the host's GPU / OpenCL drivers to the Gremlin agent so that the GPU attack can
  #   enumerate and target GPUs from inside the container.
  #
  # The easy path is to set `enabled: true` and list the vendors your cluster has in `vendors`
  #   (e.g. "nvidia" or "amd"). Each vendor's full configuration lives in a same-named block below.
  #   To customize, edit that vendor's block, or copy it to `custom` and add "custom" to `vendors`.
  gpu:
    # gremlin.gpu.enabled -- When true, the chart renders one DaemonSet per `vendors` entry, each carrying that vendor's GPU
    #   configuration, plus a `-gpu-none` DaemonSet for the cluster's non-GPU nodes. When false, none
    #   of the GPU settings have any effect and a single DaemonSet is rendered.
    enabled: false

    # NOTE: when a selected vendor sets runtimeClassName, that RuntimeClass must already exist on the
    #   cluster (typically created by the GPU Operator or your platform). This chart does NOT create
    #   RuntimeClass objects; a missing RuntimeClass will cause the Gremlin pod to fail to start.

    # gremlin.gpu.cdiDevice -- For nodes using the Nvidia Container Device Interface (CDI) rather than the Nvidia container-toolkit
    #   runtime hook. When set, the chart adds a `cdi.k8s.io/gremlin-gpu: <cdiDevice>` pod annotation
    #   so the CRI injects the named CDI device(s). Use this when NVIDIA_VISIBLE_DEVICES is NOT
    #   honored by your runtime (pure Kubernetes-native CDI). A vendor block may override this with
    #   its own `cdiDevice`.
    #
    # Requires containerd >= 1.7 or CRI-O with CDI enabled.
    cdiDevice: ""

    # gremlin.gpu.projectOpenclIcd -- Whether to project a vendor's `openclIcd` file (e.g. /etc/OpenCL/vendors/nvidia.icd) into the
    #   container, when that vendor block defines one. Defaults to true, which fixes runtimes
    #   that inject the OpenCL driver library but not the ICD file. Set to false when your CDI spec
    #   (or another mechanism) already creates the ICD file, to avoid a conflicting mount.
    projectOpenclIcd: true

    # gremlin.gpu.vendors -- Vendor blocks to target; one DaemonSet is created per entry
    vendors:
      - nvidia
      - amd

    # --- Vendor configuration blocks --------------------------------------------------------
    # Each block is the full, native-shaped GPU configuration for one vendor. Fields:
    #   nodeSelector   - node label(s) that identify AND schedule this vendor's nodes
    #   runtimeClassName - the RuntimeClass the Gremlin pods run under ("" for none)
    #   env            - environment variables added to the Gremlin container (native env entries).
    #                    For the NVIDIA container toolkit the capabilities value MUST include
    #                    `compute` (or `all`) for OpenCL.
    #   volumes        - pod volumes added to the Gremlin DaemonSet (native volume entries)
    #   volumeMounts   - container volumeMounts added to the Gremlin container (native mount entries)
    #   openclIcd      - optional {filename, library}. When set (and projectOpenclIcd is true) the
    #                    chart projects an /etc/OpenCL/vendors/<filename> file containing <library>,
    #                    for runtimes that inject the driver library but not its ICD registry file.
    #   cdiDevice      - optional per-vendor override of gremlin.gpu.cdiDevice
    #
    # NOTE: GPU device nodes (/dev/nvidia*, /dev/kfd, /dev/dri) require the container to have device
    #   access. This generally means running privileged (gremlin.podSecurity.privileged: true) or
    #   otherwise granting the pod cgroup device permissions. Device access is not required when the
    #   NVIDIA container toolkit injects the devices for you.

    nvidia:
      # Relies on the NVIDIA container toolkit: run under the "nvidia" RuntimeClass and set
      #   NVIDIA_VISIBLE_DEVICES / NVIDIA_DRIVER_CAPABILITIES so the runtime injects the driver
      #   libraries and device nodes (no host volumes required). Projects the nvidia OpenCL ICD
      #   registry file so the injected driver is discoverable.
      nodeSelector:
        nvidia.com/gpu.present: "true"
      runtimeClassName: nvidia
      # gremlin.gpu.nvidia.env -- Environment variables added to the Gremlin container for the NVIDIA container toolkit
      env:
        - name: NVIDIA_VISIBLE_DEVICES
          value: "all"
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: "all"
      volumes: []
      volumeMounts: []
      openclIcd:
        filename: nvidia.icd
        library: libnvidia-opencl.so.1

    amd:
      # Relies on the ROCm/amdgpu driver on the host: mount the /dev/kfd and /dev/dri device nodes
      #   plus the host's OpenCL ICD registry (/etc/OpenCL/vendors) so the container reaches the GPUs
      #   directly.
      nodeSelector:
        amd.com/gpu.present: "true"
      runtimeClassName: ""
      env: []
      # gremlin.gpu.amd.volumes -- Pod volumes added to the Gremlin DaemonSet for the AMD GPU device nodes and OpenCL ICD registry
      volumes:
        - name: kfd
          hostPath: { path: /dev/kfd, type: CharDevice }
        - name: dri
          hostPath: { path: /dev/dri, type: Directory }
        - name: opencl-vendors
          hostPath: { path: /etc/OpenCL/vendors, type: DirectoryOrCreate }
      # gremlin.gpu.amd.volumeMounts -- Container volumeMounts added to the Gremlin container for the AMD GPU device nodes and OpenCL ICD registry
      volumeMounts:
        - name: kfd
          mountPath: /dev/kfd
          readOnly: false
        - name: dri
          mountPath: /dev/dri
          readOnly: false
        - name: opencl-vendors
          mountPath: /etc/OpenCL/vendors
          readOnly: true

    custom:
      # A blank block to configure a GPU vendor by hand. Add "custom" to gremlin.gpu.vendors, give it
      #   a nodeSelector, and fill in the fields.
      runtimeClassName: ""
      env: []
      volumes: []
      volumeMounts: []

  # gremlin.serviceUrl -- Base URL of the Gremlin API the agent and Chao report to. The values file generated at https://app.gremlin.com/getting-started always sets this explicitly, so you rarely need to change it; override it for Gremlin Private Edition
  serviceUrl: "https://api.gremlin.com/v1"

  secret:
    # gremlin.secret.name -- Name of the Secret holding the credentials, for example when pointing at an externally managed secret
    # @default -- `gremlin-team-cert` when `gremlin.secret.managed=false`, `gremlin-secret` when `true`
    name: ""
    # gremlin.secret.type -- The type of certificate to use, can be either `certificate` or `secret`
    # To manage secrets with helm, set `managed=true` and fill in either the certificate auth or secret auth sections
    type: certificate
    # gremlin.secret.managed -- Specifies whether Gremlin should manage its secrets with Helm
    managed: false
    # gremlin.secret.teamID -- Gremlin Team ID to authenticate with
    teamID: ""
    # gremlin.secret.clusterID -- Arbitrary string that uniquely identifies your cluster (e.g. `my-production-cluster`)
    clusterID: ""

    ## Certificate auth requires: `certificate` and `key`
    # gremlin.secret.certificate -- Contents of the certificate. Required if using managed secrets of `type=certificate`
    certificate: ""
    # gremlin.secret.key -- Contents of the private key. Required if using managed secrets of `type=certificate`
    key: ""

    ## Secret auth requires: `teamSecret`
    # gremlin.secret.teamSecret -- Gremlin's team secret. Required if using managed secrets of `type=secret`
    teamSecret: ""

  proxy:
    # gremlin.proxy.url -- Specifies the http proxy the agent should use to communicate with api.gremlin.com.
    # @default -- `""` (ignored)
    url: ""

  # gremlin.extraEnv -- Specify any arbitrary environment variables to pass to the Gremlin Agent daemonset.
  extraEnv: []

  # gremlin.features
  features:

    # gremlin.features.discoverDestinationService.enabled -- Enable discovery of a destination service in a service mesh to resolve hostnames
    #   The ClusterRole associated with Gremlin's service account receives the following access
    #     - Services: get
    #     - discover.k8s.io/EndpointSlices: watch, list
    discoverDestinationService:
      enabled: false

    # gremlin.features.pushCIDRTags.enabled -- Push tags describing the CIDR ranges associated with the host the agent runs on
    #   When enabled, this helm chart does nothing, as the default behavior is to push these tags.
    #   When disabled, this helm chart passes `GREMLIN_PUSH_POD_CIDR_TAGS=false` and `GREMLIN_PUSH_ZONE_CIDR_TAGS=false` to
    #   the environment of the gremlind Daemonset.
    #
    # See: https://www.gremlin.com/docs/getting-started-network-tags#the-zone-tag
    pushCIDRTags:
      enabled: true

  # gremlin.tls -
  # A collection of TLS configurations specific to the Gremlin Daemonset.
  tls:
    # gremlin.tls.identity -
    # Configuration items for configuring the TLS identity of the Gremlin HTTP client for mTLS.
    # Identity values are made up of
    #   - `cert` portion, containing the leaf certificate for the client (plus any intermediate certificates)
    #   - `key` portion, containing the private key for the client
    #
    # These values can be supplied in three different strategies:
    #   - `remoteSecret`: a collection of ARN values for AWS Secrets Manager
    #   - `createSecret`: content supplied directly to this chart for which a new Kubernetes secret will be created
    #   - `existingSecret`: a reference to an existing Kubernetes secret (e.g. created from cert-manager)
    #
    # Only one of the above strategies should be fully configured. A strategy is not used until all of its fields are configured.
    identity:
      # gremlin.tls.identity.enabled -- Decides whether the Gremlin Daemonset should be configured for a TLS identity. [See below](#client-mtls-identity)
      enabled: false
      # gremlin.tls.identity.remoteSecret -
      # The remoteSecret strategy accepts `cert` and `key` strings in the form of ARN values for AWS Secrets Manager
      remoteSecret:
        # gremlin.tls.identity.remoteSecret.cert -
        # The ARN for the identity certificate
        cert: ""
        # gremlin.tls.identity.remoteSecret.key -
        # The ARN for the identity private key
        key: ""
      # gremlin.tls.identity.createSecret -
      # The createSecret strategy accepts PEM encoded certificate and private key content to create a new Kubernetes secret
      createSecret:
        # gremlin.tls.identity.createSecret.name -
        # The name of the new secret
        name: "gremlin-tls-identity"
        # gremlin.tls.identity.createSecret.cert -
        # The PEM-encoded certificate (expected to be a multi-line string)
        cert: ""
        # gremlin.tls.identity.createSecret.key -
        # The PEM-encoded private key (expected to be a multi-line string)
        key: ""
      # gremlin.tls.identity.existingSecret -
      # The existingSecret strategy accepts a reference to an existing Kubernetes secret
      existingSecret:
        # gremlin.tls.identity.existingSecret.name -
        # The name of the existing secret
        name: ""
        # gremlin.tls.identity.existingSecret.cert -
        # The name of the key inside the existing secret that maps to the certificate value
        cert: "tls.crt"
        # gremlin.tls.identity.existingSecret.key -
        # The name of the key inside the existing secret that maps to the private key value
        key: "tls.key"

chao:

  # chao.create -- Enable kubernetes targeting by installing k8s client
  create: true

  # chao.resources -- Set resource requests and limits for the chao deployment
  # NOTE: For backwards compatibility, a top-level `resources` block is still honored when `chao.resources`
  # is unset, but `chao.resources` is preferred and takes precedence.
  resources: {}

  # chao.updateStrategy -- The rollout strategy Kubernetes will use when updating the Chao deployment
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25% # @schema type:[integer, string]
      maxSurge: 25% # @schema type:[integer, string]

  # chao.priorityClassName -- The name of the priority class to use for the Chao deployment
  priorityClassName: ""

  # chao.nodeSelector -- Map of node labels for pod assignment for the `chao` container
  nodeSelector: {}

  # chao.tolerations -- List of node taints to tolerate for the `chao` container
  tolerations: []

  # chao.affinity -- Map of node/pod affinities for the `chao` container
  affinity: {}

  # chao.podLabels -- Kubernetes labels applied to the chao deployment and it's Pods
  podLabels: {}

  # chao.podAnnotations -- Additional annotations applied to Chao pods
  podAnnotations: {}

  serviceAccount:
    # Determines if chao's Kubernetes ServiceAccount, ClusterRole (`gremlin-watcher`) and
    #   ClusterRoleBinding are created by this chart. This is separate from `chao.create`, which
    #   controls whether the chao Deployment itself is installed. When false, a ServiceAccount
    #   named exactly `chao` must already exist in the release namespace.
    create: true
    # Annotations to add to the service account
    annotations: { }

  # chao.extraEnv -- Specify any arbitrary environment variables to pass to the Chao deployment.
  extraEnv: []

  # chao.livenessProbe -- A Kubernetes `Probe` for the `chao` container
  livenessProbe: {}

  # chao.readinessProbe -- A Kubernetes `Probe` for the `chao` container
  readinessProbe: {}

  # chao.startupProbe -- A Kubernetes `Probe` for the `chao` container
  startupProbe: {}

  # chao.initContainers -- Additional init containers for the `chao` deployment. A name colliding with
  # one the chart manages fails the install
  # NOTE: when gremlin.podSecurity.podSecurityPolicy.create is enabled, the chart's own chao PSP
  # may reject volumes an init container mounts; see chao.extraVolumes below.
  initContainers: []

  # chao.extraVolumes -- Additional volumes for the `chao` deployment. A name colliding with one the
  # chart manages fails the install
  # NOTE: when gremlin.podSecurity.podSecurityPolicy.create is enabled, the chart's own chao PSP
  # only permits the "secret" volume type; any other type is rejected at admission, not by this
  # chart.
  extraVolumes: []

  # chao.extraVolumeMounts -- Additional volume mounts for the `chao` container. A name colliding with
  # one the chart manages fails the install
  extraVolumeMounts: []

  # chao.lifecycle -- A Kubernetes `Lifecycle` object (`preStop`/`postStart`) for the `chao` container
  lifecycle: {}

  # chao.envFrom -- Additional `ConfigMap`/`Secret` sources for the `chao` container's environment.
  # Unlike `chao.extraEnv`, does not override chart-managed env vars (Kubernetes gives `env:`
  # precedence over `envFrom:`)
  envFrom: []

  # chao.terminationGracePeriodSeconds -- Termination grace period, in seconds, for the `chao`
  # deployment's pods
  # @default -- (Kubernetes default: `30`)
  terminationGracePeriodSeconds: # @schema type:[integer, string, null];pattern:^[0-9]+$

  # chao.dnsConfig -- A Kubernetes `PodDNSConfig` for the `chao` deployment's pod spec
  dnsConfig: {}

  # chao.hostAliases -- A list of Kubernetes `HostAlias` entries for the `chao` deployment's pod spec
  hostAliases: []

  # chao.podSecurityContext -- A Kubernetes pod-level `SecurityContext` for the `chao` deployment's
  # pod spec
  podSecurityContext: {}

  # chao.namespaces -- List of namespaces for Gremlin to watch for attacking
  namespaces: []

  # chao.excludedNamespaces -- List of namespaces Gremlin should never report or attack (mutually
  # exclusive with `chao.namespaces`)
  excludedNamespaces: []

  # chao.features
  features:

    # chao.features.dynamicQuery.enabled -- Let Gremlin query Kubernetes resources beyond the fixed set Chao watches by default. [See below](#chao-dynamic-queries)
    dynamicQuery:
      enabled: true

      # chao.features.dynamicQuery.allowlist -- RBAC rules describing the resources Chao may query. [See below](#chao-dynamic-queries)
      # @default -- The resources describing a cluster's shape, scheduling, and health (see values.yaml)
      allowlist:
        # How workloads are wired together, what they consume, and what has happened to them.
        - apiGroups: [""]
          resources: ["endpoints", "events", "limitranges", "persistentvolumeclaims", "persistentvolumes", "resourcequotas"]
        - apiGroups: ["apps"]
          resources: ["controllerrevisions"]
        - apiGroups: ["batch"]
          resources: ["jobs", "cronjobs"]
        - apiGroups: ["discovery.k8s.io"]
          resources: ["endpointslices"]
        - apiGroups: ["networking.k8s.io"]
          resources: ["networkpolicies", "ingressclasses"]
        # Cluster configuration that decides where and how a workload runs.
        - apiGroups: ["storage.k8s.io"]
          resources: ["storageclasses", "csidrivers", "csinodes", "volumeattachments"]
        - apiGroups: ["scheduling.k8s.io"]
          resources: ["priorityclasses"]
        - apiGroups: ["node.k8s.io"]
          resources: ["runtimeclasses"]
        - apiGroups: ["coordination.k8s.io"]
          resources: ["leases"]
        # Live resource usage, and the definitions of whatever custom resources the cluster has installed.
        - apiGroups: ["metrics.k8s.io"]
          resources: ["pods", "nodes"]
        - apiGroups: ["apiextensions.k8s.io"]
          resources: ["customresourcedefinitions"]

      # chao.features.dynamicQuery.denylist -- Resources object queries may never read, named as
      # `resource.group` or `*.group`. Passed to Chao as `-deny_resources` and enforced by Chao itself;
      # adds to Chao's built-in denylist, which always applies.
      denylist: []


  # chao.tls -
  # A collection of TLS configurations specific to the Chao Deployment.
  tls:
    # chao.tls.identity -
    # Configuration items for configuring the TLS identity of the Gremlin HTTP client for mTLS.
    # Identity values are made up of
    #   - `cert` portion, containing the leaf certificate for the client (plus any intermediate certificates)
    #   - `key` portion, containing the private key for the client
    #
    # These values can be supplied in three different strategies:
    #   - `remoteSecret`: a collection of ARN values for AWS Secrets Manager
    #   - `createSecret`: content supplied directly to this chart for which a new Kubernetes secret will be created
    #   - `existingSecret`: a reference to an existing Kubernetes secret (e.g. created from cert-manager)
    #
    # Only one of the above strategies should be fully configured. A strategy is not used until all of its fields are configured.
    identity:
      # chao.tls.identity.enabled -- Decides whether the Chao Deployment should be configured for a TLS identity. [See below](#client-mtls-identity)
      enabled: false
      # chao.tls.identity.remoteSecret -
      # The remoteSecret strategy accepts `cert` and `key` strings in the form of ARN values for AWS Secrets Manager
      remoteSecret:
        # chao.tls.identity.remoteSecret.cert -
        # The ARN for the identity certificate
        cert: ""
        # chao.tls.identity.remoteSecret.key -
        # The ARN for the identity private key
        key: ""
      # chao.tls.identity.createSecret -
      # The createSecret strategy accepts PEM encoded certificate and private key content to create a new Kubernetes secret
      createSecret:
        # chao.tls.identity.createSecret.name -
        # The name of the new secret
        name: "chao-tls-identity"
        # chao.tls.identity.createSecret.cert -
        # The PEM-encoded certificate (expected to be a multi-line string)
        cert: ""
        # chao.tls.identity.createSecret.key -
        # The PEM-encoded private key (expected to be a multi-line string)
        key: ""
      # chao.tls.identity.existingSecret -
      # The existingSecret strategy accepts a reference to an existing Kubernetes secret
      existingSecret:
        # chao.tls.identity.existingSecret.name -
        # The name of the existing secret
        name: ""
        # chao.tls.identity.existingSecret.cert -
        # The name of the key inside the existing secret that maps to the certificate value
        cert: "tls.crt"
        # chao.tls.identity.existingSecret.key -
        # The name of the key inside the existing secret that maps to the private key value
        key: "tls.key"

ssl:
  # ssl.certFile -- Add a certificate file to Gremlin's set of certificate authorities. This argument expects a file containing the
  # certificate(s) you wish to add. When set, this chart creates secret (`ssl-cert-file`) with the contents and passes
  # it to both agents. This value is ignored when blank or absent.
  # @default -- `""` (ignored)
  certFile: # @schema type:[string, null]
  # ssl.certDir -- sets the SSL_CERT_DIR environment variable on the both agents. Unlike ssl.certFile, this value accepts only a
  # path to an existing directory on the Kubernetes nodes. This value is ignored when blank or absent.
  # @default -- `""` (ignored)
  certDir: # @schema type:[string, null]

containerDrivers:
  docker-linux:
    runtimeSocket: "/var/run/docker.sock"
    name: "docker"
  containerd-linux:
    runtimeSocket: "/run/containerd/containerd.sock"
    name: "containerd"
  crio-linux:
    runtimeSocket: "/run/crio/crio.sock"
    name: "crio"
