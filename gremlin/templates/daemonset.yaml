{{- /*
Decides which Gremlin DaemonSet(s) exist and resolves each one's name, pod-selector labels, GPU
vendor config and node affinity. The DaemonSet body itself is rendered by the "gremlin.daemonset"
template (see _daemonset.tpl), which knows nothing about GPUs or node mixes.

  - GPU disabled -> a single DaemonSet, `<fullname>`.
  - GPU enabled  -> one DaemonSet per gremlin.gpu.vendors entry, `<fullname>-gpu-<vendor>`, pinned to
                    that vendor's nodes and carrying that vendor's GPU config, plus
                    `<fullname>-gpu-none` for every node that belongs to none of those vendors.
*/ -}}
{{- $fullname := include "gremlin.fullname" $ -}}
{{- if .Values.gremlin.gpu.enabled -}}
{{- $vendors := default (list) .Values.gremlin.gpu.vendors -}}
{{- range $vendor := $vendors }}
{{- include "gremlin.daemonset" (dict
      "root" $
      "name" (printf "%s-gpu-%s" $fullname $vendor)
      "selectorLabels" (dict "gremlin.com/gpu" $vendor)
      "gpu" (default (dict) (index $.Values.gremlin.gpu $vendor))
      "affinity" (include "gremlinGpuNodeAffinity" (dict "root" $ "vendors" (list $vendor) "operator" "In"))) }}
---
{{ end }}
{{- include "gremlin.daemonset" (dict
      "root" $
      "name" (printf "%s-gpu-none" $fullname)
      "selectorLabels" (dict "gremlin.com/gpu" "none")
      "affinity" (include "gremlinGpuNodeAffinity" (dict "root" $ "vendors" $vendors "operator" "NotIn"))) }}
{{- else -}}
{{- include "gremlin.daemonset" (dict "root" $ "name" $fullname) }}
{{- end -}}
