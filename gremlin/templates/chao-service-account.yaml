{{ if and .Values.chao.create .Values.chao.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chao
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- with .Values.chao.serviceAccount.annotations }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gremlin-watcher
rules:
  - apiGroups: ["apps"]
    resources: ["replicasets", "deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "watch", "list"]
  - apiGroups: [""]
    resources: ["pods", "nodes", "services", "namespaces", "replicationcontrollers"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["apps.openshift.io"]
    resources: ["deploymentconfigs"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "watch", "list"]
{{- if .Values.chao.features.dynamicQuery.enabled }}
{{- range .Values.chao.features.dynamicQuery.allowlist }}
{{- if ne (default "cluster" .scope) "namespace" }}
  - apiGroups: {{ toJson .apiGroups }}
    resources: {{ toJson .resources }}
    verbs: {{ toJson (default (list "get" "list") .verbs) }}
{{- end }}
{{- end }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: chao
subjects:
  - kind: ServiceAccount
    name: chao
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gremlin-watcher
{{- if .Values.chao.features.dynamicQuery.enabled }}
{{- $namespaced := list }}
{{- range .Values.chao.features.dynamicQuery.allowlist }}
{{- if eq (default "cluster" .scope) "namespace" }}
{{- $namespaced = append $namespaced . }}
{{- end }}
{{- end }}
{{- with $namespaced }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chao-dynamic-query
  namespace: {{ $.Release.Namespace }}
rules:
{{- range . }}
  - apiGroups: {{ toJson .apiGroups }}
    resources: {{ toJson .resources }}
    verbs: {{ toJson (default (list "get" "list") .verbs) }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chao-dynamic-query
  namespace: {{ $.Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: chao
    namespace: {{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chao-dynamic-query
{{- end }}
{{- end }}
{{ end }}
