suite: credential manager Secret access
release:
  name: gremlin-operator
  namespace: gremlin-operator-system
templates:
  - templates/credential-manager-rbac.yaml
tests:
  - it: covers every Secret in gremlin-system with no resourceNames in the credential Role
    documentSelector:
      path: metadata.name
      value: gremlin-operator-credential-manager-role
    asserts:
      - isKind:
          of: Role
      - equal:
          path: metadata.namespace
          value: gremlin-system
      - equal:
          path: rules
          value:
            - apiGroups:
                - ""
              resources:
                - events
              verbs:
                - create
                - patch
            - apiGroups:
                - ""
              resources:
                - secrets
              verbs:
                - get
                - list
                - patch
                - update
                - watch
            - apiGroups:
                - gremlin.com
              resources:
                - teamcredentials
              verbs:
                - get
                - list
                - watch
            - apiGroups:
                - gremlin.com
              resources:
                - teamcredentials/status
              verbs:
                - patch
                - update

  - it: grants the cluster-wide credential ClusterRole only the read of Secrets and the TeamCredential rights
    documentSelector:
      path: metadata.name
      value: gremlin-operator-credential-manager-cluster-role
    asserts:
      - isKind:
          of: ClusterRole
      - equal:
          path: rules
          value:
            - apiGroups:
                - ""
              resources:
                - events
              verbs:
                - create
                - patch
            - apiGroups:
                - ""
              resources:
                - secrets
              verbs:
                - get
                - list
                - watch
            - apiGroups:
                - gremlin.com
              resources:
                - teamcredentials
              verbs:
                - get
                - list
                - watch
            - apiGroups:
                - gremlin.com
              resources:
                - teamcredentials/status
              verbs:
                - patch
                - update

  - it: gives the read-only Role in a listed namespace no write on Secrets and no resourceNames
    set:
      credentialNamespaces:
        - gremlin
        - team-b
    documentSelector:
      path: $[?(@.kind=="Role" && @.metadata.namespace=="team-b")].metadata.name
      value: gremlin-operator-credential-manager-readonly-role
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups:
                - ""
              resources:
                - events
              verbs:
                - create
                - patch
            - apiGroups:
                - ""
              resources:
                - secrets
              verbs:
                - get
                - list
                - watch
            - apiGroups:
                - gremlin.com
              resources:
                - teamcredentials
              verbs:
                - get
                - list
                - watch
            - apiGroups:
                - gremlin.com
              resources:
                - teamcredentials/status
              verbs:
                - patch
                - update

  - it: grants no credential Role in the operator namespace
    asserts:
      - notExists:
          path: kind
        documentSelector:
          path: $[?(@.kind=="Role" && @.metadata.name=="gremlin-operator-credential-manager-role" && @.metadata.namespace=="gremlin-operator-system")].kind
          value: Role
          matchMany: true
          skipEmptyTemplates: true
      - notExists:
          path: kind
        documentSelector:
          path: $[?(@.kind=="Role" && @.metadata.name=="gremlin-operator-credential-manager-readonly-role" && @.metadata.namespace=="gremlin-operator-system")].kind
          value: Role
          matchMany: true
          skipEmptyTemplates: true

  - it: binds the credential Role only to the credential manager ServiceAccount
    documentSelector:
      path: metadata.name
      value: gremlin-operator-credential-manager-rolebinding
    asserts:
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: gremlin-operator-credential-manager
              namespace: gremlin-operator-system
      - equal:
          path: roleRef
          value:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: gremlin-operator-credential-manager-role
