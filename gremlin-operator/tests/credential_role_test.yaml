suite: credential manager Secret access
release:
  name: gremlin-operator
  namespace: gremlin-system
templates:
  - templates/credential-manager-rbac.yaml
  - templates/install-namespace-rbac.yaml
tests:
  - it: grants the cluster-wide credential ClusterRole only the read of Secrets and the TeamCredential rights
    template: templates/credential-manager-rbac.yaml
    documentSelector:
      path: metadata.name
      value: gremlin-operator-credential-manager-cluster-role
    asserts:
      - isKind:
          of: ClusterRole
      - equal:
          path: rules
          value:
            - apiGroups:
                - ""
              resources:
                - secrets
              verbs:
                - get
                - list
                - watch
            - apiGroups:
                - events.k8s.io
              resources:
                - events
              verbs:
                - create
                - patch
            - apiGroups:
                - gremlin.com
              resources:
                - teamcredentials
              verbs:
                - get
                - list
                - watch
            - apiGroups:
                - gremlin.com
              resources:
                - teamcredentials/status
              verbs:
                - patch
                - update

  - it: grants no credential Role in the operator namespace
    template: templates/credential-manager-rbac.yaml
    asserts:
      - notExists:
          path: kind
        documentSelector:
          path: $[?(@.kind=="Role" && @.metadata.name=="gremlin-operator-credential-manager-role")].kind
          value: Role
          matchMany: true
          skipEmptyTemplates: true
      - notExists:
          path: kind
        documentSelector:
          path: $[?(@.kind=="Role" && @.metadata.name=="gremlin-operator-credential-manager-readonly-role")].kind
          value: Role
          matchMany: true
          skipEmptyTemplates: true
      - notExists:
          path: kind
        documentSelector:
          path: $[?(@.kind=="Role" && @.metadata.namespace=="gremlin-system" && @.metadata.name!="gremlin-operator-credential-manager-leader-election-role")].kind
          value: Role
          matchMany: true
          skipEmptyTemplates: true

  - it: grants the credential manager no Secret rule in any other Role or ClusterRole it holds
    template: templates/credential-manager-rbac.yaml
    asserts:
      - exists:
          path: rules[?(@.resources[0]=="secrets")]
        documentSelector:
          path: metadata.name
          value: gremlin-operator-credential-manager-cluster-role
      - notExists:
          path: rules[?(@.resources[0]=="secrets")]
        documentSelector:
          path: metadata.name
          value: gremlin-operator-credential-manager-agent
      - notExists:
          path: rules[?(@.resources[0]=="secrets")]
        documentSelector:
          path: metadata.name
          value: gremlin-operator-credential-manager-metrics-auth-role
      - notExists:
          path: rules[?(@.resources[0]=="secrets")]
        documentSelector:
          path: metadata.name
          value: gremlin-operator-credential-manager-leader-election-role
      - notExists:
          path: rules[?(@.resources[0]=="secrets")]
        documentSelector:
          path: metadata.name
          value: gremlin-operator-credential-manager-agent-events

  - it: writes Secrets through one ClusterRole bound only in the install namespace
    template: templates/install-namespace-rbac.yaml
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups:
                - ""
              resources:
                - secrets
              verbs:
                - create
                - delete
                - get
                - patch
                - update
        documentSelector:
          path: $[?(@.kind=="ClusterRole" && @.metadata.name=="gremlin-operator-credential-copy-writer")].metadata.name
          value: gremlin-operator-credential-copy-writer
      - equal:
          path: metadata.namespace
          value: gremlin
        documentSelector:
          path: $[?(@.kind=="RoleBinding" && @.metadata.name=="gremlin-operator-credential-copy-writer")].metadata.name
          value: gremlin-operator-credential-copy-writer
      - notExists:
          path: kind
        documentSelector:
          path: $[?(@.kind=="ClusterRoleBinding" && @.roleRef.name=="gremlin-operator-credential-copy-writer")].kind
          value: ClusterRoleBinding
          matchMany: true
          skipEmptyTemplates: true
