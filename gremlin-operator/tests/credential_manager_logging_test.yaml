suite: credential manager logging
release:
  name: gremlin-operator
  namespace: gremlin-operator-system
templates:
  - templates/credential-manager-deployment.yaml
tests:
  - it: always runs the credential manager with zap development mode off
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --zap-devel=false
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --zap-devel=true
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --zap-devel

  - it: keeps zap development mode off when a log level is set
    set:
      credentialManager:
        logLevel: debug
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --zap-devel=false
      - contains:
          path: spec.template.spec.containers[0].args
          content: --zap-log-level=debug
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --zap-devel=true

  - it: keeps zap development mode off in a restricted install with every option set
    set:
      credentialNamespaces:
        - gremlin
        - team-b
      credentialManager:
        logLevel: info
        resyncInterval: 5m
        replicas: 2
        extraEnv:
          - name: SOMETHING
            value: else
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --zap-devel=false
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --zap-devel=true

  - it: offers no way to pass extra arguments that turn development mode on
    set:
      credentialManager:
        extraArgs:
          - --zap-devel=true
        args:
          - --zap-devel=true
        zapDevel: true
        zapDevelopment: true
        development: true
        zap:
          devel: true
      extraArgs:
        - --zap-devel=true
      zapDevel: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --zap-devel=false
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --zap-devel=true
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --zap-devel
