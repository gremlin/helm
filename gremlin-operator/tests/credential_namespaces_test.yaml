suite: credential namespaces
release:
  name: gremlin-operator
  namespace: gremlin-operator-system
templates:
  - NOTES.txt
  - templates/credential-manager-rbac.yaml
  - templates/credential-manager-deployment.yaml
tests:
  - it: grants the credential manager its Role in gremlin-system by default
    template: templates/credential-manager-rbac.yaml
    asserts:
      - isKind:
          of: Role
        documentSelector:
          path: metadata.name
          value: gremlin-operator-credential-manager-role
      - equal:
          path: metadata.namespace
          value: gremlin-system
        documentSelector:
          path: metadata.name
          value: gremlin-operator-credential-manager-role
      - isKind:
          of: RoleBinding
        documentSelector:
          path: metadata.name
          value: gremlin-operator-credential-manager-rolebinding
      - equal:
          path: metadata.namespace
          value: gremlin-system
        documentSelector:
          path: metadata.name
          value: gremlin-operator-credential-manager-rolebinding
      - equal:
          path: roleRef.name
          value: gremlin-operator-credential-manager-role
        documentSelector:
          path: metadata.name
          value: gremlin-operator-credential-manager-rolebinding
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: gremlin-operator-credential-manager
              namespace: gremlin-operator-system
        documentSelector:
          path: metadata.name
          value: gremlin-operator-credential-manager-rolebinding
      - isKind:
          of: ClusterRoleBinding
        documentSelector:
          path: metadata.name
          value: gremlin-operator-credential-manager-cluster-rolebinding
      - notExists:
          path: kind
        documentSelector:
          path: $[?(@.kind=="Role" && @.metadata.name=="gremlin-operator-credential-manager-readonly-role" && @.metadata.namespace=="gremlin")].kind
          value: Role
          matchMany: true
          skipEmptyTemplates: true

  - it: tells the credential manager nothing about namespaces by default
    template: templates/credential-manager-deployment.yaml
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].args
          count: 5
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --credential-namespaces=gremlin-system

  - it: drops the cluster-wide binding and tells the credential manager which namespaces to watch when a list is set
    set:
      credentialNamespaces:
        - gremlin
        - gremlin-system
        - team-b
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --credential-namespaces=gremlin,gremlin-system,team-b
        template: templates/credential-manager-deployment.yaml
      - lengthEqual:
          path: spec.template.spec.containers[0].args
          count: 6
        template: templates/credential-manager-deployment.yaml
      - notExists:
          path: kind
        documentSelector:
          path: $[?(@.kind=="ClusterRoleBinding" && @.metadata.name=="gremlin-operator-credential-manager-cluster-rolebinding")].kind
          value: ClusterRoleBinding
          matchMany: true
          skipEmptyTemplates: true
        template: templates/credential-manager-rbac.yaml
      - isKind:
          of: ClusterRole
        documentSelector:
          path: metadata.name
          value: gremlin-operator-credential-manager-cluster-role
        template: templates/credential-manager-rbac.yaml
      - isKind:
          of: ClusterRoleBinding
        documentSelector:
          path: metadata.name
          value: gremlin-operator-credential-manager-agent-binding
        template: templates/credential-manager-rbac.yaml

  - it: keeps the full Role in gremlin-system and adds a read-only Role to each other listed namespace
    set:
      credentialNamespaces:
        - gremlin
        - gremlin-system
        - team-b
    template: templates/credential-manager-rbac.yaml
    asserts:
      - isKind:
          of: Role
        documentSelector:
          path: metadata.name
          value: gremlin-operator-credential-manager-role
      - isKind:
          of: RoleBinding
        documentSelector:
          path: metadata.name
          value: gremlin-operator-credential-manager-rolebinding
      - equal:
          path: metadata.name
          value: gremlin-operator-credential-manager-readonly-role
        documentSelector:
          path: $[?(@.kind=="Role" && @.metadata.namespace=="gremlin")].metadata.name
          value: gremlin-operator-credential-manager-readonly-role
      - equal:
          path: metadata.name
          value: gremlin-operator-credential-manager-readonly-role
        documentSelector:
          path: $[?(@.kind=="Role" && @.metadata.namespace=="team-b")].metadata.name
          value: gremlin-operator-credential-manager-readonly-role
      - equal:
          path: roleRef.name
          value: gremlin-operator-credential-manager-readonly-role
        documentSelector:
          path: $[?(@.kind=="RoleBinding" && @.metadata.namespace=="team-b")].metadata.name
          value: gremlin-operator-credential-manager-readonly-rolebinding
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: gremlin-operator-credential-manager
              namespace: gremlin-operator-system
        documentSelector:
          path: $[?(@.kind=="RoleBinding" && @.metadata.namespace=="gremlin")].metadata.name
          value: gremlin-operator-credential-manager-readonly-rolebinding
      - notExists:
          path: kind
        documentSelector:
          path: $[?(@.kind=="Role" && @.metadata.name=="gremlin-operator-credential-manager-readonly-role" && @.metadata.namespace=="gremlin-system")].kind
          value: Role
          matchMany: true
          skipEmptyTemplates: true

  - it: passes the listed namespaces in the order given
    set:
      credentialNamespaces:
        - team-b
        - gremlin
    template: templates/credential-manager-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --credential-namespaces=team-b,gremlin

  - it: restricts the credential manager to the install namespace alone when only it is listed
    set:
      credentialNamespaces:
        - gremlin
    template: templates/credential-manager-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --credential-namespaces=gremlin

  - it: follows a custom install namespace when the list names it
    set:
      installNamespace:
        name: team-a
      credentialNamespaces:
        - team-a
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --credential-namespaces=team-a
        template: templates/credential-manager-deployment.yaml
      - isKind:
          of: Role
        documentSelector:
          path: $[?(@.kind=="Role" && @.metadata.namespace=="team-a")].kind
          value: Role
        template: templates/credential-manager-rbac.yaml

  - it: refuses an empty credential namespace entry
    template: NOTES.txt
    set:
      credentialNamespaces:
        - gremlin
        - ""
    asserts:
      - failedTemplate:
          errorPattern: 'credentialNamespaces'

  - it: refuses a duplicate credential namespace entry
    template: NOTES.txt
    set:
      credentialNamespaces:
        - gremlin
        - team-b
        - team-b
    asserts:
      - failedTemplate:
          errorPattern: 'credentialNamespaces'

  - it: refuses a credential namespace with upper case and underscore
    template: NOTES.txt
    set:
      credentialNamespaces:
        - gremlin
        - Team_B
    asserts:
      - failedTemplate:
          errorPattern: 'credentialNamespaces'

  - it: refuses a credential namespace that starts with a hyphen
    template: NOTES.txt
    set:
      credentialNamespaces:
        - gremlin
        - -team
    asserts:
      - failedTemplate:
          errorPattern: 'credentialNamespaces'

  - it: refuses a credential namespace longer than 63 characters
    template: NOTES.txt
    set:
      credentialNamespaces:
        - gremlin
        - aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    asserts:
      - failedTemplate:
          errorPattern: 'credentialNamespaces'

  - it: refuses a non-empty credential namespace list that leaves out the install namespace
    template: NOTES.txt
    set:
      credentialNamespaces:
        - gremlin-system
        - team-b
    asserts:
      - failedTemplate:
          errorPattern: 'credentialNamespaces'

  - it: refuses a credential namespace list that names the operator's own namespace
    template: NOTES.txt
    set:
      credentialNamespaces:
        - gremlin
        - gremlin-operator-system
    asserts:
      - failedTemplate:
          errorPattern: 'credentialNamespaces'
