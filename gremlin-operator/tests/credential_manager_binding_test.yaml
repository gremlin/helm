suite: credential manager Secret read binding
release:
  name: gremlin-operator
  namespace: gremlin-system
templates:
  - templates/credential-manager-rbac.yaml
  - templates/credential-manager-deployment.yaml
tests:
  - it: binds the credential manager cluster-wide to read Secrets under default values
    template: templates/credential-manager-rbac.yaml
    asserts:
      - isKind:
          of: ClusterRoleBinding
        documentSelector:
          path: metadata.name
          value: gremlin-operator-credential-manager-cluster-rolebinding
      - equal:
          path: roleRef
          value:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: gremlin-operator-credential-manager-cluster-role
        documentSelector:
          path: metadata.name
          value: gremlin-operator-credential-manager-cluster-rolebinding
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: gremlin-operator-credential-manager
              namespace: gremlin-system
        documentSelector:
          path: metadata.name
          value: gremlin-operator-credential-manager-cluster-rolebinding

  - it: renders no credential Role or RoleBinding for the credential manager in the release namespace
    template: templates/credential-manager-rbac.yaml
    asserts:
      - notExists:
          path: kind
        documentSelector:
          path: $[?(@.kind=="Role" && @.metadata.name=="gremlin-operator-credential-manager-role")].kind
          value: Role
          matchMany: true
          skipEmptyTemplates: true
      - notExists:
          path: kind
        documentSelector:
          path: $[?(@.kind=="RoleBinding" && @.metadata.name=="gremlin-operator-credential-manager-rolebinding")].kind
          value: RoleBinding
          matchMany: true
          skipEmptyTemplates: true

  - it: renders only the leader-election Role and RoleBinding for the credential manager in the release namespace
    template: templates/credential-manager-rbac.yaml
    asserts:
      - notExists:
          path: kind
        documentSelector:
          path: $[?(@.kind=="Role" && @.metadata.namespace=="gremlin-system" && @.metadata.name!="gremlin-operator-credential-manager-leader-election-role")].kind
          value: Role
          matchMany: true
          skipEmptyTemplates: true
      - notExists:
          path: kind
        documentSelector:
          path: $[?(@.kind=="RoleBinding" && @.metadata.namespace=="gremlin-system" && @.metadata.name!="gremlin-operator-credential-manager-leader-election-rolebinding")].kind
          value: RoleBinding
          matchMany: true
          skipEmptyTemplates: true

  - it: gives the credential manager no credential-namespaces argument
    template: templates/credential-manager-deployment.yaml
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].args
          count: 5
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --credential-namespaces=gremlin-system

  - it: keeps the cluster-wide binding and adds no Role or argument when an old credentialNamespaces value is passed
    set:
      credentialNamespaces:
        - gremlin
        - team-b
    asserts:
      - isKind:
          of: ClusterRoleBinding
        documentSelector:
          path: metadata.name
          value: gremlin-operator-credential-manager-cluster-rolebinding
        template: templates/credential-manager-rbac.yaml
      - notExists:
          path: kind
        documentSelector:
          path: $[?(@.kind=="Role" && @.metadata.namespace=="team-b")].kind
          value: Role
          matchMany: true
          skipEmptyTemplates: true
        template: templates/credential-manager-rbac.yaml
      - notExists:
          path: kind
        documentSelector:
          path: $[?(@.kind=="Role" && @.metadata.namespace=="gremlin")].kind
          value: Role
          matchMany: true
          skipEmptyTemplates: true
        template: templates/credential-manager-rbac.yaml
      - notExists:
          path: kind
        documentSelector:
          path: $[?(@.kind=="RoleBinding" && @.metadata.namespace=="gremlin")].kind
          value: RoleBinding
          matchMany: true
          skipEmptyTemplates: true
        template: templates/credential-manager-rbac.yaml
      - lengthEqual:
          path: spec.template.spec.containers[0].args
          count: 5
        template: templates/credential-manager-deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --credential-namespaces=gremlin,team-b
        template: templates/credential-manager-deployment.yaml
