        resyncInterval: "-5m"
    asserts:
      - failedTemplate:
          errorPattern: |-
            credentialManager\.resyncInterval[^\n]*["'`]-5m["'`]|credentialManager\.resyncInterval[ :=]+-5m([ ,.;:)]|$)

  - it: refuses the credentialManager resync interval 1d
    template: NOTES.txt
    set:
      credentialManager:
        resyncInterval: "1d"
    asserts:
      - failedTemplate:
          errorPattern: |-
            credentialManager\.resyncInterval[^\n]*["'`]1d["'`]|credentialManager\.resyncInterval[ :=]+1d([ ,.;:)]|$)

  - it: refuses the credentialManager log level verbose
    template: NOTES.txt
