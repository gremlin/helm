    asserts:
      - failedTemplate:
          errorPattern: |-
            reconciler\.logLevel[^\n]*["'`]0["'`]|reconciler\.logLevel[ :=]+0([ ,.;:)]|$)

  - it: refuses the reconciler log level -1
    template: NOTES.txt
