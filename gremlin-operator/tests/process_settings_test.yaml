          errorPattern: |-
            credentialManager\.logLevel[^\n]*["'`]0["'`]|credentialManager\.logLevel[ :=]+0([ ,.;:)]|$)

  - it: refuses the credentialManager log level -1
    template: NOTES.txt
    set:
