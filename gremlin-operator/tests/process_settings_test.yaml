        logLevel: "debugging"
    asserts:
      - failedTemplate:
          errorPattern: |-
            reconciler\.logLevel[^\n]*["'`]debugging["'`]|reconciler\.logLevel[ :=]+debugging([ ,.;:)]|$)

  - it: refuses the credentialManager resync interval ten minutes
    template: NOTES.txt
    set:
      credentialManager:
        resyncInterval: "ten minutes"
    asserts:
      - failedTemplate:
          errorPattern: |-
            credentialManager\.resyncInterval[^\n]*["'`]ten minutes["'`]|credentialManager\.resyncInterval[ :=]+ten minutes([ ,.;:)]|$)

  - it: refuses the credentialManager resync interval 10
    template: NOTES.txt
    set:
      credentialManager:
        resyncInterval: "10"
    asserts:
      - failedTemplate:
          errorPattern: |-
            credentialManager\.resyncInterval[^\n]*["'`]10["'`]|credentialManager\.resyncInterval[ :=]+10([ ,.;:)]|$)

  - it: refuses the credentialManager resync interval 0s
    template: NOTES.txt
    set:
      credentialManager:
        resyncInterval: "0s"
    asserts:
      - failedTemplate:
          errorPattern: |-
            credentialManager\.resyncInterval[^\n]*["'`]0s["'`]|credentialManager\.resyncInterval[ :=]+0s([ ,.;:)]|$)

  - it: refuses the credentialManager resync interval -5m
    template: NOTES.txt
    set:
