        logLevel: "-1"
    asserts:
      - failedTemplate:
          errorPattern: |-
            reconciler\.logLevel[^\n]*["'`]-1["'`]|reconciler\.logLevel[ :=]+-1([ ,.;:)]|$)

  - it: refuses the reconciler log level debugging
    template: NOTES.txt
