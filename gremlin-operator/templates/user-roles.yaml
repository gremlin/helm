{{- $prefix := include "gremlin-operator.prefix" . }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $prefix }}-agent-admin-role
  labels:
    {{- include "gremlin-operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - gremlin.com
    resources:
      - agents
    verbs:
      - "*"
  - apiGroups:
      - gremlin.com
    resources:
      - agents/status
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $prefix }}-agent-editor-role
  labels:
    {{- include "gremlin-operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - gremlin.com
    resources:
      - agents
    verbs:
      - "create"
      - "delete"
      - "get"
      - "list"
      - "patch"
      - "update"
      - "watch"
  - apiGroups:
      - gremlin.com
    resources:
      - agents/status
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $prefix }}-agent-viewer-role
  labels:
    {{- include "gremlin-operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - gremlin.com
    resources:
      - agents
    verbs:
      - "get"
      - "list"
      - "watch"
  - apiGroups:
      - gremlin.com
    resources:
      - agents/status
    verbs:
      - get
---
