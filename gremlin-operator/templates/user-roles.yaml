{{- $prefix := include "gremlin-operator.prefix" . }}
{{- $roles := dict "admin" (list "*") "editor" (list "create" "delete" "get" "list" "patch" "update" "watch") "viewer" (list "get" "list" "watch") }}
{{- range $resource := list "agent" "teamcredential" }}
{{- range $role := list "admin" "editor" "viewer" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $prefix }}-{{ $resource }}-{{ $role }}-role
  labels:
    {{- include "gremlin-operator.labels" $ | nindent 4 }}
rules:
  - apiGroups:
      - gremlin.com
    resources:
      - {{ $resource }}s
    verbs:
      {{- range get $roles $role }}
      - {{ . | quote }}
      {{- end }}
  - apiGroups:
      - gremlin.com
    resources:
      - {{ $resource }}s/status
    verbs:
      - get
---
{{- end }}
{{- end }}
