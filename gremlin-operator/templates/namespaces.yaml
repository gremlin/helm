{{- if .Values.installNamespace.create }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.installNamespace.name | quote }}
  labels:
    {{- include "gremlin-operator.labels" . | nindent 4 }}
    pod-security.kubernetes.io/enforce: privileged
  annotations:
    helm.sh/resource-policy: keep
{{- end }}
