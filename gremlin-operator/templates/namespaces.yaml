{{- if .Values.installNamespace.create }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.installNamespace.name }}
  labels:
    {{- include "gremlin-operator.labels" . | nindent 4 }}
    {{- if .Values.openshift.enabled }}
    pod-security.kubernetes.io/enforce: privileged
    {{- end }}
  annotations:
    helm.sh/resource-policy: keep
{{- end }}
{{- if .Values.gremlinSystemNamespace.create }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: gremlin-system
  labels:
    {{- include "gremlin-operator.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
{{- end }}
