{{- $podAnnotations := dict "kubectl.kubernetes.io/default-container" "manager" }}
{{- range $key, $value := .Values.credentialManager.podAnnotations }}
{{- $_ := set $podAnnotations $key $value }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gremlin-operator.credentialManagerName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "gremlin-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: credential-manager
spec:
  replicas: {{ .Values.credentialManager.replicas | int }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "gremlin-operator.name" . | quote }}
      app.kubernetes.io/component: credential-manager
  template:
    metadata:
      annotations:
        {{- include "gremlin-operator.stringMap" $podAnnotations | trim | nindent 8 }}
      labels:
        app.kubernetes.io/name: {{ include "gremlin-operator.name" . | quote }}
        app.kubernetes.io/component: credential-manager
    spec:
      serviceAccountName: {{ include "gremlin-operator.credentialManagerName" . }}
      terminationGracePeriodSeconds: 10
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.credentialManager.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.credentialManager.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.credentialManager.nodeSelector }}
      nodeSelector:
        {{- include "gremlin-operator.stringMap" . | trim | nindent 8 }}
      {{- end }}
      {{- with .Values.credentialManager.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.credentialManager.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: manager
          image: {{ include "gremlin-operator.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          command:
            - /credential-manager
          args:
            - --leader-elect
            - --health-probe-bind-address=:8082
            - --metrics-bind-address=:8444
            - --zap-devel=false
            - {{ printf "--install-namespace=%s" (toString .Values.installNamespace.name) | quote }}
            {{- with .Values.credentialManager.resyncInterval }}
            - {{ printf "--resync-interval=%s" (toString .) | quote }}
            {{- end }}
            {{- with .Values.credentialManager.logLevel }}
            - {{ printf "--zap-log-level=%s" (toString .) | quote }}
            {{- end }}
          env:
            - name: GOMEMLIMIT
              value: 400MiB
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- with .Values.credentialManager.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.credentialManager.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.credentialManager.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
