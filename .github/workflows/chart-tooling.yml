name: Chart tooling

on: pull_request

permissions:
  contents: read

env:
  HELM_DOCS_VERSION: 1.14.2
  SCHEMA_PLUGIN_VERSION: v2.2.0

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        helm: ["v3.17.0", "v4.3.0"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: ${{ matrix.helm }}

      - run: hooks/assert-helm-version.sh ${{ matrix.helm }}

      - run: hooks/helm-lint.sh

  schema:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        helm: ["v3.17.0", "v4.3.0"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: ${{ matrix.helm }}

      - run: hooks/assert-helm-version.sh ${{ matrix.helm }}

      - run: hooks/install-schema-plugin.sh ${{ env.SCHEMA_PLUGIN_VERSION }}

      - run: hooks/helm-schema.sh

      # Derived the same way the Makefile derives $(CHARTS), not hardcoded:
      # a chart's values.schema.json only gets checked here if this step
      # actually finds it.
      - id: charts
        run: |
          shopt -s nullglob
          paths=()
          for f in */Chart.yaml; do
            paths+=("${f%/Chart.yaml}/values.schema.json")
          done
          echo "paths=${paths[*]}" >> "$GITHUB_OUTPUT"

      - run: |
          hooks/check-drift.sh "values.schema.json" "make schema" \
            --tool "helm schema $(helm plugin list | awk '$1=="schema"{print $2}') (repo pins ${SCHEMA_PLUGIN_VERSION#v})" \
            ${{ steps.charts.outputs.paths }}

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - run: |
          asset="helm-docs_${HELM_DOCS_VERSION}_Linux_x86_64.tar.gz"
          expected="$(awk -v f="$asset" '$2==f{print $1}' hooks/helm-docs-checksums.txt)"
          [ -n "$expected" ] || { echo "no pinned checksum for $asset in hooks/helm-docs-checksums.txt" >&2; exit 1; }

          curl -fsSL "https://github.com/norwoodj/helm-docs/releases/download/v${HELM_DOCS_VERSION}/${asset}" -o "/tmp/$asset"
          actual="$(sha256sum "/tmp/$asset" | awk '{print $1}')"
          if [ "$actual" != "$expected" ]; then
            echo "helm-docs checksum mismatch: expected $expected, got $actual" >&2
            exit 1
          fi

          sudo tar -xz -C /usr/local/bin -f "/tmp/$asset" helm-docs

      - run: hooks/helm-docs.sh

      # Derived the same way the Makefile derives $(CHARTS), not hardcoded:
      # a chart's README.md only gets checked here if this step actually
      # finds it.
      - id: charts
        run: |
          shopt -s nullglob
          paths=()
          for f in */Chart.yaml; do
            paths+=("${f%/Chart.yaml}/README.md")
          done
          echo "paths=${paths[*]}" >> "$GITHUB_OUTPUT"

      - run: |
          hooks/check-drift.sh "README.md" "make docs" \
            --tool "helm-docs $(helm-docs --version | awk '{print $NF}') (repo pins ${HELM_DOCS_VERSION})" \
            ${{ steps.charts.outputs.paths }}
